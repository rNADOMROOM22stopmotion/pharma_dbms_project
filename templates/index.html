<div style="
    position: fixed; bottom: 20px; right: 20px;
    width: 300px; height: 350px;
    background: white; border: 1px solid #ccc;
    border-radius: 8px; display: flex; flex-direction: column;">

    <div id="chat-body" style="flex:1; padding:10px; overflow-y:auto; background:#f7f7f7;"></div>

    <div style="display:flex; border-top:1px solid #ddd;">
        <input id="chat-input" type="text" placeholder="Message..."
               style="flex:1; padding:8px; border:none;">
        <button id="chat-send" style="padding:8px 12px; border:none; background:#4A6CF7; color:white;">
            Send
        </button>
    </div>
</div>
<script>
const chatBody = document.getElementById("chat-body");
const chatInput = document.getElementById("chat-input");
const sendBtn = document.getElementById("chat-send");
function addMsg(t, c) {
    chatBody.innerHTML += `<div style="margin:5px 0;"><b>${c}:</b> ${t}</div>`;
    chatBody.scrollTop = chatBody.scrollHeight;
}

sendBtn.onclick = async () => {
    let t = chatInput.value.trim();
    if (!t) return;
    addMsg(t, "You");
    chatInput.value = "";

    let r = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message: t})
    });

    let d = await r.json();
    addMsg(d.reply, "Med-AI");
};
</script>

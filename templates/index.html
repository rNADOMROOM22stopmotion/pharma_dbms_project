    <head>
        <meta charset="utf-8" />

        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="static/css/styles.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Navigation-->

        {% include "navbar.html" %}

        <!-- Header-->

        {% include "header.html" %}

        <!-- Section-->
        <section class="py-5">
            <div class="container px-4 px-lg-5 mt-5">
                <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">

        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<div style="
    position: fixed; bottom: 20px; right: 20px;
    width: 320px; height: 380px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    display: flex; flex-direction: column;
    font-family: 'Inter', sans-serif;
">

    <!-- Header -->
    <div style="
        padding: 12px 14px;
        background: #272A2D;
        color: white;
        font-weight: 600;
        border-radius: 12px 12px 0 0;
        font-size: 16px;">
        Medify-AI Assistant
    </div>

    <!-- Chat Body -->
    <div id="chat-body" style="
        flex: 1;
        padding: 12px;
        overflow-y: auto;
        background: #f3f4f6;
        font-size: 14px;">
    </div>

    <!-- Input Area -->
    <div style="
        display: flex;
        border-top: 1px solid #e5e7eb;
        padding: 8px;
        gap: 8px;
        background: #ffffff;
        border-radius: 0 0 12px 12px;
    ">
        <input id="chat-input" type="text" placeholder="Type a message..."
               style="
                   flex: 1;
                   padding: 10px;
                   border: 1px solid #d1d5db;
                   border-radius: 8px;
                   outline: none;
                   transition: 0.2s;
               "
               onfocus="this.style.borderColor='#4A6CF7'">

        <button id="chat-send" style="
            padding: 10px 14px;
            border: none;
            background: #4A6CF7;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        "
        onmouseover="this.style.background='#3d5be8'"
        onmouseout="this.style.background='#4A6CF7'">
            Send
        </button>
    </div>
</div>
<script>
const chatBody = document.getElementById("chat-body");
const chatInput = document.getElementById("chat-input");
const sendBtn = document.getElementById("chat-send");
function addMsg(t, c) {
    chatBody.innerHTML += `<div style="margin:5px 0;"><b>${c}:</b> ${t}</div>`;
    chatBody.scrollTop = chatBody.scrollHeight;
}

sendBtn.onclick = async () => {
    let t = chatInput.value.trim();
    if (!t) return;
    addMsg(t, "You");
    chatInput.value = "";

    let r = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message: t})
    });

    let d = await r.json();
    addMsg(d.reply, "Med-AI");
};
</script>

    </body>
</html>
